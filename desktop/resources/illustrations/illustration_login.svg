<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 340">
  <ellipse cx="230" cy="316" rx="200" ry="16" fill="#DCE6FF"/>

  <!-- desk -->
  <rect x="40" y="250" width="380" height="18" rx="4" fill="#CBD5E1"/>
  <rect x="60" y="268" width="14" height="46" fill="#94A3B8"/>
  <rect x="386" y="268" width="14" height="46" fill="#94A3B8"/>

  <!-- laptop -->
  <rect x="150" y="200" width="140" height="86" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="3"/>
  <rect x="162" y="212" width="116" height="62" rx="4" fill="#2563EB"/>
  <text x="220" y="252" font-family="Poppins, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">G</text>
  <rect x="140" y="286" width="160" height="10" rx="5" fill="#CBD5E1"/>

  <!-- books -->
  <rect x="330" y="228" width="70" height="20" rx="4" fill="#16A34A"/>
  <rect x="336" y="210" width="70" height="20" rx="4" fill="#2563EB"/>

  <!-- mug -->
  <rect x="100" y="232" width="30" height="26" rx="6" fill="#2563EB"/>
  <path d="M130 238h7a8 8 0 0 1 0 16h-7" fill="none" stroke="#2563EB" stroke-width="5"/>

  <!-- plant -->
  <rect x="30" y="222" width="40" height="30" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <path d="M50 222 L44 190 Q50 170 56 190 L50 222Z" fill="#22C55E"/>

  <!-- character (simple, friendly) -->
  <g transform="translate(230,0)">
    <ellipse cx="0" cy="196" rx="38" ry="14" fill="#93C5FD" opacity="0.5"/>
    <path d="M-34 200 Q-34 150 0 150 Q34 150 34 200Z" fill="#2563EB"/>
    <rect x="-14" y="150" width="28" height="18" fill="#F8B98D"/>
    <circle cx="0" cy="126" r="26" fill="#F8B98D"/>
    <path d="M-26 118 Q0 84 26 118 Q26 96 0 92 Q-26 96 -26 118Z" fill="#0F172A"/>
    <circle cx="-9" cy="126" r="2.6" fill="#0F172A"/>
    <circle cx="9" cy="126" r="2.6" fill="#0F172A"/>
    <path d="M-7 136 Q0 141 7 136" stroke="#0F172A" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- floating cap badge -->
  <g transform="translate(370,150)">
    <rect x="-28" y="-28" width="56" height="56" rx="16" fill="#FFFFFF" stroke="#DCE6FF" stroke-width="2"/>
    <path d="M-16 -4 0 -12 16 -4 0 4Z" fill="#2563EB"/>
    <path d="M-8 -1v10c0 4 3.6 7 8 7s8-3 8-7v-10" fill="none" stroke="#2563EB" stroke-width="3"/>
  </g>

  <!-- floating chat bubble -->
  <g transform="translate(120,140)">
    <rect x="-26" y="-20" width="52" height="38" rx="14" fill="#FFFFFF" stroke="#DCE6FF" stroke-width="2"/>
    <path d="M-6 18 L-14 30 L2 18Z" fill="#FFFFFF" stroke="#DCE6FF" stroke-width="2"/>
    <circle cx="-9" cy="-1" r="3.4" fill="#2563EB"/>
    <circle cx="0" cy="-1" r="3.4" fill="#2563EB"/>
    <circle cx="9" cy="-1" r="3.4" fill="#2563EB"/>
  </g>

  <!-- floating play button -->
  <g transform="translate(60,190)">
    <circle cx="0" cy="0" r="24" fill="#2563EB"/>
    <path d="M-7 -11 L13 0 L-7 11Z" fill="#FFFFFF"/>
  </g>
</svg>